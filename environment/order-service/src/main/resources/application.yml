spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: 16
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jackson:
    serialization:
      write-dates-as-timestamps: false

orderflow:
  topics:
    order-events: order.events
    order-status-updates: order.status-updates
  cache:
    orders-ttl: 10m
  publish:
    ack-timeout-ms: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.orderflow: INFO
    org.apache.kafka: WARN
